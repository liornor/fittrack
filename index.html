<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#181b21" media="(prefers-color-scheme: dark)">
  <title>FitTrack</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <header class="app-header">
    <button id="header-back" class="icon-btn" type="button" aria-label="Back" hidden></button>
    <h1 id="header-title">FitTrack</h1>
    <a id="header-settings" class="icon-btn" href="#/settings" aria-label="Settings"></a>
  </header>

  <main id="main">
    <noscript><p class="banner banner-danger">FitTrack needs JavaScript to run.</p></noscript>
  </main>

  <nav id="bottom-nav" class="bottom-nav" aria-label="Sections"></nav>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <!-- Order matters: core first, then modules, then app.js starts everything. -->
  <script src="js/core/dates.js"></script>
  <script src="js/core/migrations.js"></script>
  <script src="js/core/storage.js"></script>
  <script src="js/core/registry.js"></script>
  <script src="js/core/router.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/modules/workouts.js"></script>
  <script src="js/modules/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
