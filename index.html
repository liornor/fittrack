<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#181b21" media="(prefers-color-scheme: dark)">
  <title>FitTrack</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="FitTrack">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <header class="app-header">
    <button id="header-back" class="icon-btn" type="button" aria-label="Back" hidden></button>
    <h1 id="header-title">FitTrack</h1>
  </header>

  <main id="main">
    <noscript><p class="banner banner-danger">FitTrack needs JavaScript to run.</p></noscript>
  </main>

  <nav id="bottom-nav" class="bottom-nav" aria-label="Sections"></nav>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <!-- Order matters: core first, then modules, then app.js starts everything. -->
  <script src="js/core/dates.js"></script>
  <script src="js/core/migrations.js"></script>
  <script src="js/core/storage.js"></script>
  <script src="js/core/registry.js"></script>
  <script src="js/core/router.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/data/plan.js"></script>
  <script src="js/modules/plan-view.js"></script>
  <script src="js/modules/today.js"></script>
  <script src="js/modules/plan.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Offline support. Only over https or localhost, and a failure here must never stop the app.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
